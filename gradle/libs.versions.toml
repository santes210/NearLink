[versions]
# Build tooling -------------------------------------------------------------
# AGP 9.x trae Kotlin integrado ("built-in Kotlin"): NO se aplica el plugin
# org.jetbrains.kotlin.android. La version de Kotlin la fija AGP, por eso el
# plugin de Compose debe ir exactamente a la misma version (2.4.20), que es la
# que traen embebida AGP 9.4.x.
agp = "9.4.0"
gradle = "9.6.0"
kotlin = "2.4.20"
ksp = "2.3.12"

# AndroidX / Compose --------------------------------------------------------
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.1"
composeBom = "2026.08.00"
# Material 3 Expressive (Material You 3). El BOM fija 1.4.0 estable; lo
# sobreescribimos con la alpha mas reciente para usar las APIs Expressive.
material3 = "1.5.0-alpha27"
room = "3.0.3"
# Driver SQLite: se usa BundledSQLiteDriver (SQLite compilado desde fuente) que
# es la implementacion recomendada por Android y da la misma version de SQLite
# en todos los dispositivos.
sqlite = "2.7.0"
coroutines = "1.11.0"

# Testing -------------------------------------------------------------------
junit = "4.13.2"
turbine = "1.2.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
# Material 3 Expressive (version explicita: sobreescribe la del BOM)
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose compiler plugin: va ligado a la version de Kotlin de AGP 9.4 (2.4.20)
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
