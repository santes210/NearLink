name: Android CI
on:
  push: { branches: [ "main", "master" ] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug --stacktrace
      - run: ./gradlew :app:testDebugUnitTest --stacktrace
      - run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: nearlink-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
